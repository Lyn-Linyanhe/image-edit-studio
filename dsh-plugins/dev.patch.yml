#
#   dsh --profile web --patch <this file> --dump-config
#   dsh --profile web --patch <this file>
#
# Remove this file from the command line to remove the plugin from the boot.
- insert:
    - id: image-edit
      name: 'file:///C:/Users/typ/Desktop/mantu/dsh-plugins/dsh-image-edit/lib/index.js'
      config:
        url: 'http://127.0.0.1:8000'
        label: '改图'
